<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Pago exitoso! — CourseAI</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#0d0d0f;color:#f0efe8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.card{background:#141417;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:2.5rem;max-width:440px;width:100%;text-align:center;}
.icon{width:64px;height:64px;border-radius:50%;background:rgba(93,232,106,0.12);border:1px solid rgba(93,232,106,0.25);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 1.2rem;}
.logo{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:1.5rem;}
.logo-mark{width:28px;height:28px;border-radius:7px;background:#c8f060;display:flex;align-items:center;justify-content:center;font-size:13px;}
.logo-text{font-family:'Instrument Serif',serif;font-size:18px;}
h1{font-family:'Instrument Serif',serif;font-size:1.7rem;margin-bottom:.5rem;line-height:1.2;}
h1 em{font-style:italic;color:#c8f060;}
p{font-size:13px;color:#9b9a94;line-height:1.7;margin-bottom:1rem;}
.course-name{font-size:14px;font-weight:500;color:#f0efe8;background:rgba(200,240,96,0.06);border:1px solid rgba(200,240,96,0.15);border-radius:8px;padding:10px 16px;margin:1rem 0;}
.btn{display:inline-block;background:#c8f060;color:#000;text-decoration:none;font-weight:600;font-size:14px;padding:12px 28px;border-radius:10px;margin-top:.5rem;transition:background .15s;}
.btn:hover{background:#a8d040;}
.email-note{font-size:12px;color:#5a5955;margin-top:1rem;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">✦</div>
    <span class="logo-text">CourseAI</span>
  </div>
  <div class="icon">✓</div>
  <h1>¡Pago <em>aprobado</em>!</h1>
  <p>Tu compra fue procesada exitosamente. En unos minutos vas a recibir un email con los datos de acceso.</p>
  <div class="course-name" id="course-name">Tu curso está listo 🎉</div>
  <p>Revisá tu bandeja de entrada (y la carpeta de spam por las dudas).</p>
  <a href="/" class="btn">Volver al inicio</a>
  <div class="email-note">¿No llegó el email? Escribinos a soporte y lo resolvemos.</div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const course = params.get('course');
if (course) document.getElementById('course-name').textContent = '📚 ' + decodeURIComponent(course);
</script>
</body>
</html>
